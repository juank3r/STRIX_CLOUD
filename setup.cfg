[flake8]
# Keep in sync with black's line-length in pyproject.toml.
max-line-length = 120
# E203/W503 conflict with black's formatting; E501 handled by max-line-length.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    build,
    dist

[isort]
profile = black
line_length = 120
