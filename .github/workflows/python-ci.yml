name: Python CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f agents/python_agent/requirements.txt ]; then pip install -r agents/python_agent/requirements.txt; fi
      - name: Run example
        run: |
          python agents/python_agent/agent.py
