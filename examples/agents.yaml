repositories:
  - name: my-azure-acr
    provider: azure
    connector: azure_connector
    # You can provide the subscription id directly, or use Key Vault reference:
    #   subscription_id: "secret:subscription_id"
    # The orchestrator will try Key Vault first (if AZURE_KEYVAULT_NAME is set),
    # then fall back to the environment variable `AZURE_SUBSCRIPTION_ID`.
    connector_config:
      subscription_id: "secret:subscription_id"
    targets:
      - type: acr
        name: myregistry
        resource_group: my-rg
    tests:
      - name: check_acr_images
        description: "List images and run read-only metadata checks"

  - name: my-aks-cluster
    provider: azure
    connector: azure_connector
    connector_config:
      subscription_id: "secret:subscription_id"
    targets:
      - type: aks
        name: my-aks
        resource_group: my-aks-rg
    tests:
      - name: check_nodes
        description: "Collect node info and non-destructive checks"
